<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gentle Theme Studio · Lienzo vivo</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101419;color:#eef3f4;font:15px system-ui}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:24px;margin:0 0 12px}canvas{display:block;width:100%;height:auto;background:#080a0c;touch-action:none;border-radius:8px}section{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 0}button,select,label.btn{font:inherit;background:#253039;color:white;border:1px solid #647784;border-radius:6px;padding:6px 10px;cursor:pointer}button[aria-pressed=true]{background:#137078}small{color:#bfd1d4}input[type=file]{max-width:190px}#msg{min-height:1.5em}</style>
<main><h1>Lienzo vivo</h1><canvas aria-label="Imagen con animación procedural"></canvas><section><button id="play">Pausar</button><button id="before" aria-pressed="false">Ver original</button><label>Intensidad <input id="strength" type="range" min="0" max="100" value="100"></label><button id="save">Guardar copia HTML</button></section>
<details><summary>Dirigir otra escena o editar esta</summary><section><label>Imagen local <input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><select id="kind"><option value="aura">Aura que fluye</option><option value="glow">Luz que respira</option><option value="turn">Giro facial leve</option><option value="protect">Proteger zona</option></select><button id="suggest">Sugerir zonas por color</button><button id="undo">Deshacer última zona</button></section><small>Arrastra sobre la imagen para añadir una zona. El centro aporta el color; los bordes quedan anclados. Las sugerencias detectan color, no rostros. Haz clic sobre una sugerencia para añadirla.</small><section id="picks"></section></details><p id="msg" aria-live="polite"></p></main>
<script id="recipe" type="application/json">__DATA__</script><script id="runtime">__CORE__
const engine=createLivingEngine(), el=k=>document.getElementById(k),can=document.querySelector('canvas'),ctx=can.getContext('2d'), data=JSON.parse(el('recipe').textContent);let src,screen,sim,orig=false,paused=matchMedia('(prefers-reduced-motion:reduce)').matches,t=0,last=0,drag=null,seq=0;
function rebuild(){sim=engine.prepare(src.data,can.width,can.height,data.zones.map(z=>({...z,strength:z.kind==='protect'?z.strength:z.strength*el('strength').value/100})));draw();el('msg').textContent=data.zones.length+' zonas · ciclo de 8 segundos'}
function draw(){if(!sim)return;if(orig)ctx.putImageData(src,0,0);else{screen.data.set(sim.frame(t));ctx.putImageData(screen,0,0)}if(drag){const [a,b,c,d]=drag;ctx.strokeStyle='white';ctx.beginPath();ctx.ellipse((a+c)/2,(b+d)/2,Math.abs(c-a)/2,Math.abs(d-b)/2,0,0,7);ctx.stroke()}}
function load(url,zones){const id=++seq,im=new Image();im.onload=()=>{if(id!==seq)return;const scale=Math.min(1,1280/Math.max(im.width,im.height));can.width=Math.max(1,Math.round(im.width*scale));can.height=Math.max(1,Math.round(im.height*scale));ctx.drawImage(im,0,0,can.width,can.height);src=ctx.getImageData(0,0,can.width,can.height);screen=ctx.createImageData(can.width,can.height);t=0;data.image=url;data.zones=zones;el('picks').replaceChildren();rebuild()};im.onerror=()=>el('msg').textContent='No se pudo abrir la imagen.';im.src=url}
function add(z){if(data.zones.length>=16){el('msg').textContent='Máximo de 16 zonas.';return}data.zones.push(z);rebuild()}
el('play').textContent=paused?'Reproducir':'Pausar';el('play').onclick=()=>{paused=!paused;el('play').textContent=paused?'Reproducir':'Pausar'};
el('before').onclick=()=>{orig=!orig;el('before').setAttribute('aria-pressed',orig);draw()};el('strength').oninput=()=>src&&rebuild();
el('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>10485760){el('msg').textContent='Usa PNG, JPEG o WebP de hasta 10 MiB.';return}const r=new FileReader();r.onload=()=>load(r.result,[]);r.readAsDataURL(f)};
el('undo').onclick=()=>{if(src){data.zones.pop();rebuild()}};el('suggest').onclick=()=>{if(!src)return;const box=el('picks');box.replaceChildren();const list=engine.suggest(src.data,can.width,can.height);if(!list.length)box.textContent='Sin zonas de color destacadas. Marca una manualmente.';list.forEach(z=>{const b=document.createElement('button');b.textContent=z.tint+' · '+Math.round(z.x*100)+'%, '+Math.round(z.y*100)+'%';b.onclick=()=>{add(z);b.remove()};box.append(b)})};
function pt(e){const b=can.getBoundingClientRect();return [Math.max(0,Math.min(can.width-1,(e.clientX-b.left)*can.width/b.width)),Math.max(0,Math.min(can.height-1,(e.clientY-b.top)*can.height/b.height))]}
can.onpointerdown=e=>{if(!src)return;const p=pt(e);drag=[...p,...p];can.setPointerCapture(e.pointerId)};
can.onpointermove=e=>{if(drag){drag.splice(2,2,...pt(e));draw()}};can.onpointercancel=()=>{drag=null;draw()};
can.onpointerup=e=>{if(!drag)return;const [a,b]=drag,[c,d]=pt(e);drag=null;if(Math.abs(a-c)<3||Math.abs(b-d)<3){draw();return}const x=(a+c)/2,y=(b+d)/2,j=(Math.floor(x)+Math.floor(y)*can.width)*4;add({kind:el('kind').value,x:x/can.width,y:y/can.height,rx:Math.abs(a-c)/2/can.width,ry:Math.abs(b-d)/2/can.height,angle:0,tint:'#'+Array.from(src.data.slice(j,j+3)).map(n=>n.toString(16).padStart(2,'0')).join(''),strength:1,phase:0})};
el('save').onclick=()=>{const doc=document.documentElement.cloneNode(true);doc.querySelector('#recipe').textContent=JSON.stringify({...data,zones:data.zones.map(z=>({...z,strength:z.kind==='protect'?z.strength:z.strength*el('strength').value/100}))}).replace(/</g,'\\u003c');doc.querySelector('#picks').replaceChildren();const url=URL.createObjectURL(new Blob(['<!doctype html>',doc.outerHTML],{type:'text/html'}));const a=document.createElement('a');a.href=url;a.download='escena-viva.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
function tick(now){if(now-last>=1000/30){if(!paused&&!orig&&!document.hidden){t+=Math.min(.1,(now-last)/1000);draw()}last=now}requestAnimationFrame(tick)}load(data.image,data.zones);requestAnimationFrame(tick);
</script></html>
